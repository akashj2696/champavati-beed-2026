<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>स्पर्धा नोंदणी फॉर्म</title>

<style>
body{font-family:Segoe UI;background:#ffe8d6}
.container{max-width:800px;margin:20px auto;background:#fff;padding:20px;border-radius:12px}
label{font-weight:600;margin-top:12px;display:block}
input,select{width:100%;padding:8px;margin-top:5px;border-radius:6px;border:1px solid #ccc}
.section{display:none;background:#fff4e6;padding:12px;margin-top:10px;border-radius:8px}
.note{font-size:13px;color:#555;margin-top:4px}
button{margin-top:20px;width:100%;padding:12px;background:#ff6600;color:#fff;border:none;border-radius:8px}
</style>
</head>

<body>

<div class="container">
<h2>स्पर्धा नोंदणी फॉर्म</h2>

<form id="regForm">

<label>स्पर्धेचे नाव</label>
<select id="competition" onchange="showTypes()" required>
<option value="">निवडा</option>
<option value="Dance">नृत्य स्पर्धा</option>
<option value="Singing">गीत गायन स्पर्धा</option>
<option value="Acting">एकपात्री अभिनय</option>
</select>

<!-- Type -->
<div id="typeSection" class="section">
<label>स्पर्धा प्रकार</label>
<select id="type" onchange="showForm()"></select>
</div>

<!-- Group -->
<div id="groupSection" class="section">
<label>शाळेचे नाव</label><input id="school">
<label>गाण्याचे नाव</label><input id="song">
<label>वयोगट</label><input id="age">
<label>एकूण विद्यार्थी संख्या</label><input id="count">
</div>

<!-- Individual -->
<div id="individualSection" class="section">
<label>स्पर्धकाचे नाव</label><input id="participant">
<label>शाळेचे नाव</label><input id="school2">
<label>वयोगट</label><input id="age2">
</div>

<!-- Pair (UPDATED) -->
<div id="pairSection" class="section">
<label>स्पर्धकांची नावे</label>
<input id="pairNames" placeholder="उदा. राम पवार, श्याम देशमुख">
<div class="note">※ दोन्ही स्पर्धकांची नावे स्वल्पविराम ( , ) ने लिहा</div>
<label>शाळेचे नाव</label><input id="school3">
<label>वयोगट</label><input id="age3">
</div>

<!-- Family -->
<div id="familySection" class="section">
<label>स्पर्धकाचे नाव</label><input id="participant2">
<label>शाळेचे नाव</label><input id="school4">
<label>नाते</label><input id="relation">
</div>

<button type="submit">सबमिट करा</button>
</form>
</div>

<script>
const scriptURL="https://script.google.com/macros/s/AKfycbytpgeBRf5LGYTiO19kV7ANFpoBwfMqyfTNaa-yCEkyYUr82JHVZaalxMQT8Qj4q7JRRA/exec";

function hideAll(){
  groupSection.style.display="none";
  individualSection.style.display="none";
  pairSection.style.display="none";
  familySection.style.display="none";
}

function showTypes(){
  typeSection.style.display="block";
  type.innerHTML="<option value=''>निवडा</option>";

  if(competition.value==="Dance"){
    [
      "समूह नृत्य",
      "शिशुगट समूह नृत्य",
      "वैयक्तिक नृत्य",
      "जोडी नृत्य",
      "कुटुंब नृत्य"
    ].forEach(t=>{
      type.innerHTML+=`<option>${t}</option>`;
    });
  }

  if(competition.value==="Singing"){
    ["समूह गीत गायन","वैयक्तिक गीत गायन"].forEach(t=>{
      type.innerHTML+=`<option>${t}</option>`;
    });
  }

  if(competition.value==="Acting"){
    typeSection.style.display="none";
    hideAll();
    individualSection.style.display="block";
  }
}

function showForm(){
  hideAll();
  if(type.value.includes("समूह")) groupSection.style.display="block";
  if(type.value.includes("वैयक्तिक")) individualSection.style.display="block";
  if(type.value.includes("जोडी")) pairSection.style.display="block";
  if(type.value.includes("कुटुंब")) familySection.style.display="block";
}

regForm.addEventListener("submit",e=>{
  e.preventDefault();
  fetch(scriptURL,{
    method:"POST",
    body:JSON.stringify({
      competition:competition.value,
      type:type.value,
      school:school.value||"",
      song:song.value||"",
      age:age.value||"",
      count:count.value||"",
      participant:participant.value||"",
      pairNames:pairNames.value||"",
      relation:relation.value||""
    })
  }).then(()=>alert("नोंद यशस्वी"));
});
</script>

</body>
</html>
