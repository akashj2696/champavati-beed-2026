<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>चंपावती महोत्सव | स्पर्धा नोंदणी</title>

<style>
body{
    font-family:Segoe UI,sans-serif;
    background:linear-gradient(to right,#ffecd2,#fcb69f);
}
.container{
    max-width:800px;
    margin:20px auto;
    background:#fff;
    border-radius:16px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    overflow:hidden;
}
.header img{width:100%;height:220px;object-fit:cover}
form{padding:25px}
label{font-weight:600;margin-top:14px;display:block}
.star{color:red}
input,select{
    width:100%;
    padding:10px;
    margin-top:6px;
    border-radius:8px;
    border:1px solid #ccc;
}
.section{
    display:none;
    background:#fff4e6;
    padding:15px;
    border-radius:10px;
    margin-top:15px
}
button{
    margin-top:25px;
    width:100%;
    background:#ff6600;
    color:#fff;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}
.footer{
    text-align:center;
    padding:12px;
    background:#fff4e6;
    color:#8b0000;
    font-weight:600
}
.visitors{
    text-align:center;
    font-weight:700;
    margin-top:10px;
    color:#333;
}

/* Modal */
.modal{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.6);
    z-index:999;
}
.modal-content{
    background:#fff;
    max-width:400px;
    margin:15% auto;
    padding:25px;
    border-radius:14px;
    text-align:center;
}
.download-btn{
    display:block;
    background:#ff6600;
    color:#fff;
    padding:12px;
    text-decoration:none;
    border-radius:8px;
    margin-bottom:12px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<img src="https://i.postimg.cc/PxPBCd0n/Screenshot_2026_01_11_125417.png">
</div>

<form id="regForm">

<label>तालुका <span class="star">*</span></label>
<select id="taluka" required>
<option value="">निवडा</option>
<option>बीड</option><option>माजलगाव</option><option>गेवराई</option>
<option>धारूर</option><option>केज</option><option>वडवणी</option>
<option>परळी</option><option>आष्टी</option><option>पाटोदा</option>
<option>शिरूर (का.)</option><option>अंबाजोगाई</option>
</select>

<label>शाळेचे नाव <span class="star">*</span></label>
<input id="school" required>

<label>स्पर्धेचे नाव <span class="star">*</span></label>
<select id="competition" required onchange="showMain()">
<option value="">निवडा</option>
<option value="Dance">नृत्य स्पर्धा</option>
<option value="Singing">गीत गायन स्पर्धा</option>
<option value="Acting">एकपात्री अभिनय</option>
<option value="Drawing">चित्रकला</option>
<option value="Rangoli">रांगोळी</option>
</select>

<!-- DANCE -->
<div id="danceSection" class="section">
<label>नृत्य प्रकार</label>
<select id="type" onchange="danceLogic()">
<option value="">निवडा</option>
<option>समूह नृत्य</option>
<option>वैयक्तिक नृत्य</option>
<option>जोडी नृत्य</option>
<option>कुटुंब नृत्य</option>
<option>शिशुगट ग्रुप नृत्य</option>
</select>

<label>गाण्याचे बोल</label>
<input id="song">

<div id="pairNote" style="display:none;color:red;font-size:14px">
👉 दोन्ही स्पर्धकांची नावे एका बॉक्समध्ये लिहा
</div>

<label>वयोगट</label>
<select id="age">
<option>Nursery</option>
<option>LKG</option>
<option>UKG</option>
<option>१ ली ते ३ री</option>
<option>४ थी ते ६ वी</option>
<option>७ वी ते १० वी</option>
</select>

<label>एकूण विद्यार्थी संख्या</label>
<input id="count" type="number">
</div>

<!-- SINGING -->
<div id="singingSection" class="section">
<label>गायन प्रकार</label>
<select id="type2">
<option>समूह गीत गायन</option>
<option>वैयक्तिक गीत गायन</option>
</select>

<label>गाण्याचे बोल</label>
<input id="song2">

<label>वयोगट</label>
<select id="age2">
<option>१ ली ते ३ री</option>
<option>४ थी ते ६ वी</option>
<option>७ वी ते १० वी</option>
</select>
</div>

<!-- COMMON AGE -->
<div id="ageOnly" class="section">
<label>वयोगट</label>
<select id="age3">
<option>१ ली ते ३ री</option>
<option>४ थी ते ६ वी</option>
<option>७ वी ते १० वी</option>
</select>
</div>

<label>स्पर्धकाचे नाव</label>
<input id="participant">

<label>मोबाईल क्रमांक <span class="star">*</span></label>
<input id="mobile" pattern="[0-9]{10}" required>

<button type="submit">सबमिट करा</button>

</form>

<div class="visitors">
👥 Total Visitors: <span id="visits">Loading...</span>
</div>

<div class="footer">नोंदणी Google Sheet मध्ये सेव्ह होईल</div>
</div>

<!-- MODAL -->
<div class="modal" id="successModal">
<div class="modal-content">
<h2>नोंद यशस्वी ✅</h2>
<a class="download-btn" href="https://drive.google.com/file/d/1ZCe07CRzmvSUuI6JWIgqY5d5NGHS1fnZ/view" target="_blank">
नियमावली डाउनलोड
</a>
<button onclick="closeModal()">Close</button>
</div>
</div>

<script>
const scriptURL="https://script.google.com/macros/s/AKfycbytpgeBRf5LGYTiO19kV7ANFpoBwfMqyfTNaa-yCEkyYUr82JHVZaalxMQT8Qj4q7JRRA/exec";

function showMain(){
danceSection.style.display="none";
singingSection.style.display="none";
ageOnly.style.display="none";

if(competition.value==="Dance") danceSection.style.display="block";
if(competition.value==="Singing") singingSection.style.display="block";
if(["Acting","Drawing","Rangoli"].includes(competition.value)) ageOnly.style.display="block";
}

function danceLogic(){
pairNote.style.display = (type.value==="जोडी नृत्य")?"block":"none";
}

document.getElementById("regForm").addEventListener("submit",e=>{
e.preventDefault();

const data={
taluka:taluka.value,
school:school.value,
competition:competition.value,
type:type.value||type2.value,
song:song.value||song2.value,
age:age.value||age2.value||age3.value,
count:count.value,
participant:participant.value,
mobile:mobile.value
};

fetch(scriptURL,{method:"POST",body:JSON.stringify(data)})
.then(()=>{
successModal.style.display="block";
regForm.reset();
})
.catch(()=>alert("Error"));
});

function closeModal(){successModal.style.display="none";}

/* Visitor Counter */
fetch("https://api.countapi.xyz/hit/champavati/visits")
.then(res=>res.json())
.then(data=>visits.innerText=data.value);
</script>

</body>
</html>
